<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Design system "Clear" (ai-design) — tokens. Light: 선명한 블루. Dark: 그래파이트.
   Use only these variables in product CSS; the style check warns on raw colors and font stacks elsewhere.
   Spec and component rules: DESIGN.md. Colors adapted from the Tailwind CSS palette (MIT). */
:root {
  /* color: surfaces */
  --bg: #ffffff;
  --surface: #f8fafc;
  --sunk: #f1f5f9;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  /* color: text */
  --fg: #0f172a;
  --muted: #475569;
  --subtle: #64748b;
  /* color: the one accent (actions, links, current state, human gates) */
  --accent: #1d4ed8;
  --accent-hover: #1e40af;
  --accent-fg: #ffffff;
  --accent-soft: #eff6ff;
  /* color: status (meaning only, never decoration) */
  --ok: #067647;      --ok-soft: #ecfdf3;
  --warn: #b54708;    --warn-soft: #fffaeb;
  --danger: #b42318;  --danger-soft: #fef3f2;
  /* color: code and terminals */
  --code-bg: #0f172a;
  --code-fg: #e2e8f0;
  --code-muted: #94a3b8;
  --code-line: #334155;
  --code-ok: #86efac;
  --code-warn: #fcd34d;
  --code-danger: #fca5a5;
  --focus: #1d4ed8;

  /* type */
  --font-sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 12px; --text-s: 14px; --text-m: 16px; --text-l: 18px;
  --text-h3: 18px; --text-h2: 24px; --text-h1: clamp(30px, 4.4vw, 44px);
  --leading: 1.7; --leading-tight: 1.3;

  /* space, shape */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-s: 6px; --radius-m: 8px; --radius-l: 10px;
  --border: 1px solid var(--line);
  --measure: 72ch;
  --page: 1120px;
  --motion: 180ms ease-out;
  color-scheme: light;
}

/* Dark follows the OS unless the page sets data-theme. Keep both blocks identical. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e2124; --surface: #25292c; --sunk: #191b1e; --line: #33373b; --line-strong: #454b51;
    --fg: #e4e6e8; --muted: #b4b9be; --subtle: #9ba1a6;
    --accent: #7cb7e8; --accent-hover: #a9d0f0; --accent-fg: #10151a; --accent-soft: #233240;
    --ok: #47cd89; --ok-soft: #16322a; --warn: #fdb022; --warn-soft: #3a2c12; --danger: #f97066; --danger-soft: #3b1f1d;
    --code-bg: #111315; --code-fg: #e4e6e8; --code-muted: #8a9096; --code-line: #33373b;
    --code-ok: #86e0b0; --code-warn: #f5c45e; --code-danger: #f6a19a; --focus: #7cb7e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e2124; --surface: #25292c; --sunk: #191b1e; --line: #33373b; --line-strong: #454b51;
  --fg: #e4e6e8; --muted: #b4b9be; --subtle: #9ba1a6;
  --accent: #7cb7e8; --accent-hover: #a9d0f0; --accent-fg: #10151a; --accent-soft: #233240;
  --ok: #47cd89; --ok-soft: #16322a; --warn: #fdb022; --warn-soft: #3a2c12; --danger: #f97066; --danger-soft: #3b1f1d;
  --code-bg: #111315; --code-fg: #e4e6e8; --code-muted: #8a9096; --code-line: #33373b;
    --code-ok: #86e0b0; --code-warn: #f5c45e; --code-danger: #f6a19a; --focus: #7cb7e8;
  color-scheme: dark;
}
/* Design system "Clear" (ai-design) — base and components. Needs tokens.css first.
   Every value comes from a token. Class names start with ds- so they can sit next to product CSS. */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: var(--text-m); line-height: var(--leading);
  word-break: keep-all; overflow-wrap: break-word;
}
h1, h2, h3, h4 { margin: 0; line-height: var(--leading-tight); font-weight: 700; text-wrap: balance; }
h1 { font-size: var(--text-h1); letter-spacing: -0.02em; }
h2 { font-size: var(--text-h2); letter-spacing: -0.01em; }
h3 { font-size: var(--text-h3); }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-hover); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, kbd, pre { font-family: var(--font-mono); }
:not(pre) > code {
  font-size: 0.88em; background: var(--sunk); border: var(--border); border-radius: 4px;
  padding: 0 4px; overflow-wrap: anywhere; word-break: normal;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* layout */
.ds-page { max-width: var(--page); margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
@media (min-width: 720px) { .ds-page { padding-inline: var(--space-5); } }
.ds-stack { display: grid; gap: var(--space-4); }
.ds-lede { font-size: var(--text-l); color: var(--muted); max-width: var(--measure); }
.ds-eyebrow { font-size: var(--text-s); font-weight: 700; color: var(--accent); }
.ds-muted { color: var(--muted); }

/* top bar */
.ds-topbar {
  display: flex; align-items: center; gap: var(--space-5); min-height: 60px;
  padding: 0 var(--space-4); border-bottom: var(--border); background: var(--bg);
}
.ds-topbar a { color: var(--muted); text-decoration: none; font-size: var(--text-s); }
.ds-topbar a[aria-current="page"] { color: var(--fg); font-weight: 700; }

/* buttons: one primary per view */
.ds-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-m);
  font: 700 var(--text-s) / 1 var(--font-sans); cursor: pointer; text-decoration: none;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line-strong);
  transition: background-color var(--motion), border-color var(--motion);
}
.ds-btn:hover { border-color: var(--subtle); }
.ds-btn--primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ds-btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }

/* copyable command: an action the reader runs */
.ds-cmd {
  display: flex; align-items: center; gap: var(--space-2); min-width: 0;
  background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius-l);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
}
.ds-cmd code, .ds-cmd pre {
  flex: 1; min-width: 0; margin: 0; background: none; border: 0; padding: 0; color: inherit;
  font-size: var(--text-s); line-height: 1.7; white-space: pre; overflow-x: auto;
}
.ds-cmd .ds-c { color: var(--code-muted); }
/* The copy button stays quiet so a page with several commands keeps one primary action. */
.ds-cmd button {
  align-self: flex-start; flex: none; min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-s);
  border: 1px solid var(--code-line); background: transparent; color: var(--code-fg);
  font: 500 13px / 1 var(--font-sans); cursor: pointer;
}
.ds-cmd button:hover { border-color: var(--code-muted); }
.ds-cmd button:focus-visible { outline-color: var(--code-fg); }
@media (max-width: 600px) { .ds-cmd code, .ds-cmd pre { white-space: pre-wrap; overflow-wrap: anywhere; } }

/* real output: what a command printed, pasted from an actual run; not copyable, lines marked by meaning */
.ds-output {
  margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: var(--radius-l);
  padding: var(--space-4); font: var(--text-s) / 1.7 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
}
.ds-output .ds-prompt { color: var(--code-muted); }
.ds-output .ds-err { color: var(--code-danger); }
.ds-output .ds-warn { color: var(--code-warn); }
.ds-output .ds-ok { color: var(--code-ok); }

/* numbered steps: a sequence; .is-human marks a person's decision */
.ds-steps { list-style: none; margin: 0; padding: 0; counter-reset: ds-step; }
.ds-steps > li {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--space-3); align-items: start;
  padding: var(--space-3) 0; border-bottom: var(--border);
}
.ds-steps > li:last-child { border-bottom: 0; }
.ds-steps > li::before {
  counter-increment: ds-step; content: counter(ds-step);
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sunk); color: var(--fg); font: 700 13px / 1 var(--font-sans);
}
.ds-steps > li.is-human::before { background: var(--accent); color: var(--accent-fg); }
.ds-steps .ds-who { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; padding-top: 3px; }
.ds-steps h3, .ds-steps h4 { font-size: var(--text-m); }
.ds-steps p { font-size: 15px; color: var(--muted); margin-top: 2px; }

/* table: comparisons and lists of facts */
.ds-table-wrap { overflow-x: auto; }
.ds-table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.ds-table th, .ds-table td { text-align: left; vertical-align: top; padding: 10px 16px 10px 0; border-bottom: var(--border); }
.ds-table thead th { font-size: 13px; font-weight: 500; color: var(--subtle); border-bottom-color: var(--line-strong); }
.ds-table tbody tr:last-child > * { border-bottom: 0; }

/* panel: groups related content; border only, no shadow, no side stripe */
.ds-panel { background: var(--bg); border: var(--border); border-radius: var(--radius-l); padding: var(--space-5); min-width: 0; }
.ds-panel--sunk { background: var(--surface); }

/* note: a short remark that must not be missed */
.ds-note { display: grid; gap: var(--space-1); background: var(--accent-soft); border-radius: var(--radius-m); padding: var(--space-3) var(--space-4); font-size: 15px; }
.ds-note--warn { background: var(--warn-soft); }
.ds-note--danger { background: var(--danger-soft); }

/* badge: state, owner, kind */
.ds-badge {
  display: inline-flex; align-items: center; min-height: 22px; padding: 0 var(--space-2); border-radius: 4px;
  font-size: var(--text-xs); font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap;
}
.ds-badge--accent { background: var(--accent-soft); color: var(--accent); }
.ds-badge--ok { background: var(--ok-soft); color: var(--ok); }
.ds-badge--warn { background: var(--warn-soft); color: var(--warn); }
.ds-badge--danger { background: var(--danger-soft); color: var(--danger); }

/* diagram frame (Mermaid or element-built diagrams) */
.ds-figure { margin: 0; border: var(--border); border-radius: var(--radius-l); padding: var(--space-4); overflow-x: auto; background: var(--bg); }
.ds-figure figcaption { font-size: 13px; color: var(--subtle); margin-top: var(--space-2); }

/* Long, secondary content (a full output, a prompt, the hand-made examples) folded behind its one-line summary. */
.ds-details { border-top: var(--border); border-bottom: var(--border); }
.ds-details > summary { cursor: pointer; padding: var(--space-3) 0; min-height: 44px; display: flex; align-items: center;
  gap: var(--space-2); color: var(--fg); font-weight: 500; list-style: none; }
.ds-details > summary::-webkit-details-marker { display: none; }
.ds-details > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform 150ms ease-out; flex: none; }
.ds-details[open] > summary::before { transform: rotate(45deg); }
.ds-details > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ds-details > :not(summary) { margin-bottom: var(--space-4); }
@media (prefers-reduced-motion: reduce) { .ds-details > summary::before { transition: none; } }
</style>
<script>
// Design system "Clear" (ai-design): light/dark switch. Load in <head> so the saved theme applies before first paint.
// Without a saved choice the page follows the OS (tokens.css). A .theme-toggle button flips it and the choice is
// remembered per browser. Fires a "themechange" event on document so diagrams can redraw.
(() => {
  const root = document.documentElement, KEY = "clear-theme";
  const dark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const saved = localStorage.getItem(KEY); if (saved) root.dataset.theme = saved; } catch {}
  const sync = () => document.querySelectorAll(".theme-toggle").forEach((b) => {
    b.setAttribute("aria-pressed", String(dark()));
    b.textContent = dark() ? "라이트 모드" : "다크 모드";
  });
  window.clearTheme = { isDark: dark };
  document.addEventListener("DOMContentLoaded", sync);
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".theme-toggle")) return;
    root.dataset.theme = dark() ? "light" : "dark";
    try { localStorage.setItem(KEY, root.dataset.theme); } catch {}
    sync();
    document.dispatchEvent(new Event("themechange"));
  });
})();
</script>
<title>AI 협업 레포 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Repo map (docs/site/map.html). Layout: one pannable, zoomable world of labelled zones; toolbar on top, minimap and detail panel float above it.
   Built with the team design system "Clear" like the guide page. */
/* Clear tokens come from the pinned ai-design (scripts/build-site.sh); only the canvas parts are defined here. */
:root { --grid: var(--sunk); --edge: var(--subtle); }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.6;
  overflow: hidden; word-break: keep-all; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 5; }
.bar h1 { font-size: 16px; font-weight: 700; margin: 0; white-space: nowrap; }
.bar .meta { color: var(--subtle); font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.btn { font: 500 13px var(--font-sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong);
  border-radius: 6px; min-height: 34px; padding: 0 10px; cursor: pointer; }
.btn:hover { background: var(--surface); }
.btn[aria-pressed="true"] { background: var(--sunk); }
.btn:focus-visible, .chip:focus-visible, .node:focus-visible, #q:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { position: relative; }
#q { font: 13px var(--font-sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 6px; min-height: 34px; padding: 0 10px; width: 200px; }
.results { position: absolute; top: 40px; right: 0; width: 280px; max-height: 320px; overflow: auto; background: var(--bg);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg);
  font: 13px var(--font-sans); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--accent-soft); }
.results small { color: var(--subtle); font-family: var(--font-mono); font-size: 11px; display: block; }
.zones { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.chip { font: 12px var(--font-sans); color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip:hover { color: var(--fg); border-color: var(--line-strong); }

/* canvas */
.view { position: relative; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 24px 24px; }
.view.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.animate { transition: transform 420ms cubic-bezier(.2, .7, .2, 1); }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.edge.dash { stroke-dasharray: 6 5; }
.edge-label { font: 12px var(--font-sans); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; }
.edge.hot { stroke: var(--accent); stroke-width: 2.6; }
.edge-label.hot { fill: var(--accent); font-weight: 700; }
.arrowhead { fill: var(--edge); }

.zone { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 24px; }
.zone > header { display: grid; gap: 2px; margin-bottom: 16px; }
.zone h2 { font-size: 22px; line-height: 1.3; margin: 0; letter-spacing: -.01em; }
.zone .sub { color: var(--muted); font-size: 14px; margin: 0; max-width: 80ch; }
.zone .kicker { font: 500 12px var(--font-mono); color: var(--subtle); letter-spacing: .04em; }
.group + .group { margin-top: 18px; }
.group h3 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 8px; letter-spacing: .02em; }
.grid { display: grid; gap: 10px; }
.node { display: grid; gap: 4px; align-content: start; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; min-width: 0;
  font: inherit; color: inherit; }
.node:hover { border-color: var(--line-strong); }
.node strong { font-size: 14px; line-height: 1.35; }
.node code { font: 12px var(--font-mono); color: var(--subtle); overflow-wrap: anywhere; }
.node p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.node .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font: 500 11px var(--font-sans); border-radius: 999px; padding: 1px 8px; border: 1px solid transparent; }
.tag.human { color: var(--accent); background: var(--accent-soft); }
.tag.new { color: var(--ok); background: var(--ok-soft); }
.tag.ext { color: var(--warn); background: var(--warn-soft); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.world.focusing .node:not(.sel):not(.near) { opacity: .35; }
.world.focusing .zone { }
.step-n { font: 500 12px var(--font-mono); color: var(--subtle); }

/* level of detail: far = titles only */
.world[data-lod="far"] .node p, .world[data-lod="far"] .node code, .world[data-lod="far"] .edge-label,
.world[data-lod="far"] .zone .sub, .world[data-lod="far"] .zone .kicker { visibility: hidden; }
.zone { --inv: 1; }
.world[data-lod="far"] .zone h2 { position: absolute; left: 22px; top: 14px; transform: scale(var(--inv)); transform-origin: 0 0;
  white-space: nowrap; background: var(--surface); padding-right: 8px; z-index: 1; }

/* floating parts */
.mini { position: absolute; right: 16px; bottom: 16px; width: 200px; background: var(--bg); border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 6px; z-index: 3; }
.mini .map { position: relative; width: 100%; cursor: pointer; }
.mini .mz { position: absolute; background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 2px; }
.mini .vp { position: absolute; border: 2px solid var(--accent); border-radius: 2px; pointer-events: none; }
.zoomlvl { position: absolute; left: 16px; bottom: 16px; z-index: 3; font: 12px var(--font-mono); color: var(--subtle);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.hint { position: absolute; left: 16px; top: 12px; z-index: 3; font-size: 12px; color: var(--subtle);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.panel { position: absolute; top: 12px; right: 16px; width: 340px; max-height: calc(100% - 24px); overflow: auto; z-index: 4;
  background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px 18px;
  display: grid; gap: 10px; }
.panel h2 { margin: 0; font-size: 18px; line-height: 1.35; padding-right: 28px; }
.panel .zone-name { font: 500 12px var(--font-mono); color: var(--subtle); }
.panel p { margin: 0; color: var(--muted); }
.panel code { font: 12px var(--font-mono); background: var(--sunk); padding: 2px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.panel li button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.panel .x { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border: 0; background: none;
  color: var(--subtle); font-size: 20px; cursor: pointer; border-radius: 6px; }
.panel .x:hover { background: var(--surface); color: var(--fg); }
.panel a { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--subtle); align-items: center; }

const $ = (s, el = document) => el.querySelector(s);
const view = $("#view"), world = $("#world"), svg = $("#edges");
const NODES = new Map(), ZONE_OF = new Map();

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
const TAG = { human: ["human", "사람"], new: ["new", "이번 추가"], ext: ["ext", "다른 레포"] };

function render() {
  for (const z of ZONES) {
    const el = document.createElement("section");
    el.className = "zone"; el.id = "z-" + z.id; el.style.left = z.x + "px"; el.style.width = z.w + "px";
    el.innerHTML = `<header><span class="kicker">${esc(z.kicker)}</span><h2>${esc(z.title)}</h2><p class="sub">${esc(z.sub)}</p></header>` +
      z.groups.map(g => `<div class="group">${g.title ? `<h3>${esc(g.title)}</h3>` : ""}<div class="grid" style="grid-template-columns:repeat(${g.cols},minmax(0,1fr))">` +
        g.nodes.map(nd => {
          NODES.set(nd.id, nd); ZONE_OF.set(nd.id, z);
          const tags = nd.tags.map(t => `<span class="tag ${TAG[t][0]}">${TAG[t][1]}</span>`).join("");
          return `<button class="node" type="button" id="n-${nd.id}" data-id="${nd.id}">${tags ? `<span class="tags">${tags}</span>` : ""}<strong>${esc(nd.t)}</strong><code>${esc(nd.p)}</code><p>${esc(nd.d)}</p></button>`;
        }).join("") + `</div></div>`).join("");
    world.appendChild(el);
  }
  // stack rows by measured height
  const rows = [...new Set(ZONES.map(z => z.row))].sort();
  let y = 0;
  for (const r of rows) {
    let h = 0;
    for (const z of ZONES.filter(z => z.row === r)) { const el = $("#z-" + z.id); el.style.top = y + "px"; h = Math.max(h, el.offsetHeight); }
    for (const z of ZONES.filter(z => z.row === r)) $("#z-" + z.id).style.minHeight = h + "px";
    y += h + 90;
  }
  document.querySelectorAll(".zone").forEach(z => {  // title text width at scale 1, for far-zoom titles
    const r = document.createRange(); r.selectNodeContents(z.querySelector("h2")); z.dataset.tw = r.getBoundingClientRect().width; });
  WORLD.w = Math.max(...ZONES.map(z => z.x + z.w)); WORLD.h = y - 90;
  world.style.width = WORLD.w + "px"; world.style.height = WORLD.h + "px";
  svg.setAttribute("width", WORLD.w); svg.setAttribute("height", WORLD.h);
  drawEdges(); drawMini();
  $("#zones").innerHTML = ZONES.map(z => `<button class="chip" type="button" data-zone="${z.id}">${esc(z.title)}</button>`).join("");
}
const WORLD = { w: 0, h: 0 };

function box(id) {
  const el = $("#n-" + id); let x = 0, y = 0, e = el;
  while (e && e !== world) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2 };
}
function anchor(b, toward) {
  const dx = toward.cx - b.cx, dy = toward.cy - b.cy;
  if (Math.abs(dx) / (b.w / 2) > Math.abs(dy) / (b.h / 2)) return { x: dx > 0 ? b.x + b.w : b.x, y: b.cy, dir: [Math.sign(dx), 0] };
  return { x: b.cx, y: dy > 0 ? b.y + b.h : b.y, dir: [0, Math.sign(dy)] };
}
function drawEdges() {
  const ns = "http://www.w3.org/2000/svg";
  svg.querySelectorAll("g.e").forEach(g => g.remove());
  EDGES.forEach(([a, b, label, dashed], i) => {
    const A = box(a), B = box(b), p = anchor(A, B), q = anchor(B, A);
    const k = Math.max(40, Math.min(160, Math.hypot(q.x - p.x, q.y - p.y) / 3));
    const d = `M${p.x},${p.y} C${p.x + p.dir[0] * k},${p.y + p.dir[1] * k} ${q.x + q.dir[0] * k},${q.y + q.dir[1] * k} ${q.x},${q.y}`;
    const g = document.createElementNS(ns, "g"); g.setAttribute("class", "e"); g.dataset.a = a; g.dataset.b = b;
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", d); path.setAttribute("class", "edge" + (dashed ? " dash" : "")); path.setAttribute("marker-end", "url(#arr)");
    g.appendChild(path);
    if (label) {
      const t = document.createElementNS(ns, "text"); t.setAttribute("class", "edge-label"); t.textContent = label;
      const mx = (p.x + q.x) / 2 + (p.dir[0] + q.dir[0]) * k * .375, my = (p.y + q.y) / 2 + (p.dir[1] + q.dir[1]) * k * .375;
      t.setAttribute("x", mx); t.setAttribute("y", my - 6); t.setAttribute("text-anchor", "middle");
      g.appendChild(t);
    }
    svg.appendChild(g);
  });
}

// pan / zoom
const S = { x: 0, y: 0, s: 1 };
const MIN = 0.12, MAX = 2.2;
function apply(animate = false) {
  world.classList.toggle("animate", animate);
  world.style.transform = `translate(${S.x}px, ${S.y}px) scale(${S.s})`;
  world.dataset.lod = S.s < 0.42 ? "far" : "near";
  const inv = Math.min(4, Math.max(1, 0.9 / S.s));
  document.querySelectorAll(".zone").forEach(z => {  // keep each far-zoom title inside its zone
    const fit = (z.offsetWidth - 44) / Math.max(1, +z.dataset.tw);
    z.style.setProperty("--inv", Math.min(inv, Math.max(1, fit)).toFixed(2)); });
  $("#zoomlvl").textContent = Math.round(S.s * 100) + "%";
  drawViewport();
}
function zoomAt(cx, cy, f, animate = false) {
  const r = view.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const s = Math.min(MAX, Math.max(MIN, S.s * f)); const k = s / S.s;
  S.x = px - (px - S.x) * k; S.y = py - (py - S.y) * k; S.s = s; apply(animate);
}
function fitRect(x, y, w, h, pad = 40, animate = true, maxS = MAX) {
  const r = view.getBoundingClientRect();
  const s = Math.min(maxS, Math.max(MIN, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h)));
  S.s = s; S.x = (r.width - w * s) / 2 - x * s; S.y = (r.height - h * s) / 2 - y * s; apply(animate);
}
const fitAll = (animate = true) => fitRect(0, 0, WORLD.w, WORLD.h, 24, animate);
function goZone(id) { const el = $("#z-" + id); fitRect(el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight, 24, true, 1.1); }
function goNode(id) {
  const b = box(id), r = view.getBoundingClientRect(), s = Math.max(S.s, 0.95);
  S.s = s; S.x = r.width / 2 - b.cx * s; S.y = r.height / 2 - b.cy * s; apply(true); select(id);
}

const pts = new Map(); let moved = 0, last = null, pinch = null;
view.addEventListener("pointerdown", e => {
  if (e.target.closest(".panel, .mini")) return;
  view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0; last = { x: e.clientX, y: e.clientY }; world.classList.remove("animate");
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
view.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch.d); pinch.d = d; moved += 10; return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 4) { view.classList.add("dragging"); S.x += dx; S.y += dy; apply(); }
});
function up(e) {
  const wasClick = moved <= 4 && pts.size === 1;
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) view.classList.remove("dragging");
  if (wasClick && e.type === "pointerup") {
    const nodeEl = document.elementFromPoint(e.clientX, e.clientY)?.closest(".node");
    if (nodeEl) select(nodeEl.dataset.id); else clearSel();
  }
  if (pts.size === 1) last = [...pts.values()][0];
}
view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
view.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016))); }, { passive: false });
view.addEventListener("keydown", e => {
  const step = 60;
  if (e.key === "ArrowLeft") S.x += step; else if (e.key === "ArrowRight") S.x -= step;
  else if (e.key === "ArrowUp") S.y += step; else if (e.key === "ArrowDown") S.y -= step;
  else if (e.key === "+" || e.key === "=") { const r = view.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25, true); return; }
  else if (e.key === "-") { const r = view.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8, true); return; }
  else if (e.key === "0") { fitAll(); return; }
  else if (e.key === "Escape") { clearSel(); return; }
  else if (e.key === "Enter" && document.activeElement?.classList.contains("node")) { select(document.activeElement.dataset.id); return; }
  else return;
  e.preventDefault(); apply();
});
// keyboard users: Tab into a card selects nothing until Enter; focusing scrolls it into view of the canvas
world.addEventListener("focusin", e => { const el = e.target.closest(".node"); if (el && !pts.size) goNodeSoft(el.dataset.id); });
function goNodeSoft(id) { const b = box(id), r = view.getBoundingClientRect();
  const sx = b.x * S.s + S.x, sy = b.y * S.s + S.y;
  if (sx < 0 || sy < 0 || sx + b.w * S.s > r.width || sy + b.h * S.s > r.height) { S.x = r.width / 2 - b.cx * S.s; S.y = r.height / 2 - b.cy * S.s; apply(true); } }

$("#zin").onclick = () => { const r = view.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.3, true); };
$("#zout").onclick = () => { const r = view.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.3, true); };
$("#fit").onclick = () => fitAll();
$("#zones").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) goZone(c.dataset.zone); });

// selection + detail panel
function linksOf(id) { return EDGES.filter(([a, b]) => a === id || b === id); }
function select(id) {
  const nd = NODES.get(id); if (!nd) return;
  document.querySelectorAll(".node.sel, .node.near").forEach(el => el.classList.remove("sel", "near"));
  $("#n-" + id).classList.add("sel");
  const rel = linksOf(id);
  rel.forEach(([a, b]) => $("#n-" + (a === id ? b : a)).classList.add("near"));
  world.classList.add("focusing");
  svg.querySelectorAll("g.e").forEach(g => {
    const hot = g.dataset.a === id || g.dataset.b === id;
    g.querySelector("path").classList.toggle("hot", hot); g.querySelector("path").setAttribute("marker-end", hot ? "url(#arrhot)" : "url(#arr)");
    g.querySelector("text")?.classList.toggle("hot", hot);
  });
  $("#pzone").textContent = ZONE_OF.get(id).title;
  $("#ptitle").textContent = nd.t;
  $("#ppath").innerHTML = `<code>${esc(nd.p)}</code>`;
  $("#pdesc").textContent = nd.d;
  const url = /^[.\w].*\/|^[.\w][\w.-]*\.\w+$/.test(nd.p) && !nd.p.includes(" ") && !nd.p.startsWith("~")
    ? (nd.p.startsWith("jungrok5/ai-design") ? "https://github.com/jungrok5/ai-design" : REPO + nd.p.replace(/\/$/, "")) : null;
  const related = rel.map(([a, b, label]) => { const o = a === id ? b : a; return `<li><button type="button" data-go="${o}">${esc(NODES.get(o).t)}</button>${label ? ` <span style="color:var(--subtle)">· ${esc(label)}</span>` : ""}</li>`; }).join("");
  $("#plinks").innerHTML = (url ? `<p><a href="${url}" target="_blank" rel="noopener">GitHub에서 열기</a></p>` : "") +
    (related ? `<div><strong style="font-size:13px">연결</strong><ul>${related}</ul></div>` : "");
  $("#panel").hidden = false; $("#hint").hidden = true;
}
function clearSel() {
  world.classList.remove("focusing");
  document.querySelectorAll(".node.sel, .node.near").forEach(el => el.classList.remove("sel", "near"));
  svg.querySelectorAll("path.hot").forEach(p => { p.classList.remove("hot"); p.setAttribute("marker-end", "url(#arr)"); });
  svg.querySelectorAll("text.hot").forEach(t => t.classList.remove("hot"));
  $("#panel").hidden = true;
}
$("#close").onclick = clearSel;
$("#plinks").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) goNode(b.dataset.go); });

// search
const q = $("#q"), res = $("#results"); let hits = [], cur = 0;
function showResults() {
  const v = q.value.trim().toLowerCase();
  if (!v) { res.hidden = true; return; }
  hits = [...NODES.values()].filter(nd => (nd.t + " " + nd.p + " " + nd.d).toLowerCase().includes(v)).slice(0, 12); cur = 0;
  res.innerHTML = hits.length ? hits.map((nd, i) => `<button type="button" role="option" aria-selected="${i === 0}" data-go="${nd.id}">${esc(nd.t)}<small>${esc(nd.p)}</small></button>`).join("")
    : `<div style="padding:8px;color:var(--subtle);font-size:13px">찾은 항목이 없습니다</div>`;
  res.hidden = false;
}
q.addEventListener("input", showResults);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!hits.length) return; cur = (cur + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    res.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-selected", i === cur)); }
  else if (e.key === "Enter" && hits[cur]) { goNode(hits[cur].id); res.hidden = true; }
  else if (e.key === "Escape") { res.hidden = true; }
});
res.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { goNode(b.dataset.go); res.hidden = true; } });
document.addEventListener("pointerdown", e => { if (!e.target.closest(".search")) res.hidden = true; });

// minimap
const map = $("#map"); let mk = 1;
function drawMini() {
  mk = map.clientWidth / WORLD.w; map.style.height = WORLD.h * mk + "px";
  map.innerHTML = ZONES.map(z => { const el = $("#z-" + z.id);
    return `<div class="mz" style="left:${el.offsetLeft * mk}px;top:${el.offsetTop * mk}px;width:${el.offsetWidth * mk}px;height:${el.offsetHeight * mk}px"></div>`; }).join("") + `<div class="vp" id="vp"></div>`;
}
function drawViewport() {
  const vp = $("#vp"); if (!vp) return; const r = view.getBoundingClientRect();
  vp.style.left = (-S.x / S.s) * mk + "px"; vp.style.top = (-S.y / S.s) * mk + "px";
  vp.style.width = (r.width / S.s) * mk + "px"; vp.style.height = (r.height / S.s) * mk + "px";
}
map.addEventListener("pointerdown", e => {
  e.stopPropagation(); const r = map.getBoundingClientRect(), vr = view.getBoundingClientRect();
  const wx = (e.clientX - r.left) / mk, wy = (e.clientY - r.top) / mk;
  S.x = vr.width / 2 - wx * S.s; S.y = vr.height / 2 - wy * S.s; apply(true);
});

window.addEventListener("resize", () => { drawMini(); drawViewport(); });
let started = false;
function start() { if (started) return; started = true; render(); fitAll(false); }
// lay out after the fonts load so card heights are final; start anyway if they never do
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
setTimeout(start, 2500);
</script>
<script>
// Design system "Clear" (ai-design): copy button for .ds-cmd blocks. Include once per page.
// Text inside .ds-c (comments) is left out, so a block can explain each line and still paste cleanly.
document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".ds-cmd button");
  if (!btn) return;
  const code = btn.parentElement.querySelector("code, pre");
  const copy = code.cloneNode(true);
  copy.querySelectorAll(".ds-c").forEach((n) => n.remove());
  const text = copy.textContent.split("\n").map((l) => l.trimEnd()).filter(Boolean).join("\n");
  const label = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사됨"; } catch { btn.textContent = "복사 실패"; }
  setTimeout(() => { btn.textContent = label; }, 1500);
});
</script>
</body>
