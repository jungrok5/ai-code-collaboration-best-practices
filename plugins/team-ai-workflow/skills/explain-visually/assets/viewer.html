<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시각적 설명</title><style>body{font:16px/1.7 system-ui;margin:0;background:#f6f8fb;color:#172333;word-break:keep-all}main{max-width:1100px;margin:auto;padding:24px}button,a{min-height:44px}button{padding:9px 14px;background:white;border:1px solid #ccd4df;border-radius:4px;font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #2451cb}button[aria-pressed=true]{background:#2451cb;color:white}#tabs,#controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#stage{overflow:auto;background:white;padding:10px;display:flex;min-height:260px}#stage svg{flex-shrink:0}.active>rect,.active>polygon{stroke:#2451cb;stroke-width:3}#detail{background:white;padding:20px;margin-top:20px}h1{line-height:1.3}a{color:#2451cb}#steps{display:flex;gap:8px}#stage [data-node]{cursor:pointer}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><script defer src="diagram-runtime.js"></script><script defer src="viewer.js"></script></head><body><main><h1 id="title">시각적 설명</h1><p id="summary"></p><nav id="tabs" aria-label="그림 선택"></nav><div id="controls"><button id="minus">축소</button><button id="plus">확대</button><button id="fit">전체보기</button><span id="scale" role="status"></span><a id="download" download>원본 저장</a></div><div id="stage"></div><section id="detail" aria-live="polite"><h2 id="step-title"></h2><p id="description"></p><a id="source" target="_blank" rel="noopener">원문 확인</a><div id="steps"><button id="prev">이전</button><button id="next">다음 단계</button></div></section></main></body></html>
