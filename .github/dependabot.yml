# Dependabot keeps GitHub Actions (SHA pins + version comments) and project dependencies fresh.
# Only ecosystems present in every repo are enabled; uncomment the block for your stack (npm / uv / gomod / cargo),
# otherwise Dependabot reports a failed "Dependabot Updates" run for the missing manifest.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "area/ci", "risk/low"]
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

