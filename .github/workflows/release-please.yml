# Release automation from Conventional Commits: opens/updates a release PR; merging it tags a release.
# Use a PAT or GitHub App token (RELEASE_PLEASE_TOKEN) so the release tag can trigger other workflows;
# falls back to GITHUB_TOKEN (release PR still works, but tag-triggered workflows will not run).
# Requires the repo setting Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
# (make github-setup enables it), otherwise it fails with "GitHub Actions is not permitted to create or approve pull requests".
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:  # re-run with fresh repo settings (a re-run keeps the original run's token)

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
