# @claude responder: mention @claude in an issue, PR comment, or review to ask questions or request changes.
# Setup: install the Claude GitHub App (`/install-github-app` in Claude Code) and add the
# ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
# Only users with write access can trigger it; bots are rejected (prompt-injection defence).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One Claude run per issue/PR at a time; a second mention queues instead of cancelling a run in flight.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(make setup-ci),Bash(make lint),Bash(make typecheck),Bash(make test),Bash(make check),Bash(make ai-validate),Bash(gh pr checks:*),Bash(gh run view:*)"
            --append-system-prompt "Follow AGENTS.md. Keep changes minimal and scoped to the request. Run `make check` before finishing and report the result. Never force-push, never edit protected paths (.env*, lockfiles, CODEOWNERS, .claude/settings.json, scripts/rulesets)."
