# Baseline CI. Runs the same `make` targets humans and agents run locally (see the Commands table in AGENTS.md).
# The single required status check for branch protection is the job named `ci-ok`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # --- Toolchains: each step runs only when the matching manifest exists ---
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || hashFiles('yarn.lock') != '' && 'yarn' || 'npm' }}

      - name: Enable corepack (pnpm / yarn)
        if: hashFiles('pnpm-lock.yaml', 'yarn.lock') != ''
        run: corepack enable

      - name: Set up Python (uv)
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
          enable-cache: true

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # --- The same commands as `make check` locally ---
      - name: Install dependencies
        run: make setup-ci

      - name: Lint
        run: make lint

      - name: Writing and UI style (docs/17)
        run: make style

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Build
        run: make build

  # Stable, single required check for rulesets. Add other jobs to `needs` as you grow.
  ci-ok:
    name: ci-ok
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All required jobs passed
        run: echo "ok"
