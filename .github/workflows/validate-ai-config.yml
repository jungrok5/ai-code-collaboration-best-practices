# Validates every AI/automation config: Claude plugin & marketplace manifests, settings schema,
# skills/agents frontmatter, workflow YAML (actionlint + zizmor), shell hooks, YAML, Markdown.
name: Validate AI config

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".claude-plugin/**"
      - "plugins/**"
      - ".github/**"
      - "scripts/**"
      - ".cursor/**"
      - ".gemini/**"
      - "*.md"
      - "*.json"
      - "*.yml"
      - "*.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-config:
    name: ai-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          npm install -g @anthropic-ai/claude-code markdownlint-cli2
          uv tool install yamllint
          uv tool install check-jsonschema
          uv tool install actionlint-py
          uv tool install shellcheck-py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run scripts/check-ai-config.sh
        run: scripts/check-ai-config.sh

  zizmor:
    name: zizmor (workflow security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: regular
