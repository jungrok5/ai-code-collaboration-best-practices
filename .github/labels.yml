# Labels as code. Synced by .github/workflows/labels-sync.yml (crazy-max/ghaction-github-labeler)
# and by `make labels` (scripts/setup-github.sh labels). Keep this list flat and simple.

# --- AI workflow state (issues): ai:ready → ai:in-progress → ai:review | ai:needs-human → ai:done ---
- name: "ai:ready"
  color: "0E8A16"
  description: "Ready for an AI agent: testable acceptance criteria, bounded scope, no open product decision"
- name: "ai:in-progress"
  color: "1D76DB"
  description: "An AI agent is actively working on this; avoid duplicate work"
- name: "ai:review"
  color: "5319E7"
  description: "Agent opened a draft PR; waiting for human review"
- name: "ai:needs-human"
  color: "D93F0B"
  description: "Agent blocked, or a decision is required from a human"
- name: "ai:done"
  color: "C2E0C6"
  description: "Agent-implemented work merged"

# --- AI provenance (pull requests) ---
- name: "ai:assisted"
  color: "C5DEF5"
  description: "PR written by a human with AI assistance (disclosed in the PR body)"
- name: "ai:generated"
  color: "8A63D2"
  description: "PR authored by an AI agent; requires full human review and approval"

# --- size (applied by pr-size-labeler) ---
- name: "size/XS"
  color: "3CBF00"
  description: "≤ 20 changed lines"
- name: "size/S"
  color: "5D9801"
  description: "≤ 100 changed lines"
- name: "size/M"
  color: "7F7203"
  description: "≤ 300 changed lines"
- name: "size/L"
  color: "A14F05"
  description: "≤ 800 changed lines — justify or split"
- name: "size/XL"
  color: "C32D07"
  description: "> 800 changed lines — must be split into a stack"

# --- type ---
- name: "type/bug"
  color: "D73A4A"
  description: "Something isn't working"
- name: "type/feature"
  color: "A2EEEF"
  description: "New capability"
- name: "type/chore"
  color: "EDEDED"
  description: "Maintenance, refactoring, tooling"
- name: "type/docs"
  color: "0075CA"
  description: "Documentation only"
- name: "type/security"
  color: "B60205"
  description: "Security-relevant change"
- name: "type/question"
  color: "D876E3"
  description: "Question or discussion"

# --- area (extend per project) ---
- name: "area/ci"
  color: "BFD4F2"
  description: "GitHub Actions, workflows, build, scripts"
- name: "area/ai-config"
  color: "BFD4F2"
  description: "AGENTS.md, Claude/Copilot/Cursor/Gemini configuration, plugins"
- name: "area/deps"
  color: "BFD4F2"
  description: "Dependency updates"
- name: "area/docs"
  color: "BFD4F2"
  description: "Docs, README, ADRs"
- name: "area/tests"
  color: "BFD4F2"
  description: "Test code"

# --- priority ---
- name: "priority/p0"
  color: "B60205"
  description: "Critical — outage, data loss, security"
- name: "priority/p1"
  color: "D93F0B"
  description: "High — blocks a release"
- name: "priority/p2"
  color: "FBCA04"
  description: "Normal — planned"
- name: "priority/p3"
  color: "C2E0C6"
  description: "Low — nice to have"

# --- status / community ---
- name: "status/needs-triage"
  color: "EDEDED"
  description: "New; not yet reviewed by a maintainer"
- name: "status/blocked"
  color: "000000"
  description: "Blocked on another issue or a decision"
- name: "status/stale"
  color: "EEEEEE"
  description: "No activity; will auto-close"
- name: "risk/low"
  color: "BFDADC"
  description: "Low-risk change (docs, tests, deps patch); eligible for auto-merge once approved"
- name: "dependencies"
  color: "0366D6"
  description: "Dependency update (Dependabot default)"
- name: "good first issue"
  color: "7057FF"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
